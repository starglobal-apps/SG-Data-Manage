<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a56db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SG Data">
  <title>SG Data</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SVG icon sprite -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-entry" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v4h4v2h-4v4h-2v-4H7v-2h4V7z"/></symbol>
  <symbol id="i-data" viewBox="0 0 24 24"><path d="M4 20h16v2H2V2h2zm3-2V10h3v8zm5 0V4h3v14zm5 0v-7h3v7z"/></symbol>
  <symbol id="i-review" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.5-4.3-4.3 1.4-1.4 2.9 2.9 6.3-6.3 1.4 1.4z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.5 4.5 14 3l-9 9 9 9 1.5-1.5L8 12z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6-1.4-1.4L12.2 12 7.6 7.4z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6-1.4-1.4L12 12.2 7.4 7.6z"/></symbol>
  <symbol id="i-att" viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm8 1c-3 0-8 1.5-8 4.5V20h16v-2.5c0-3-5-4.5-8-4.5zM8 14c-.4 0-.8 0-1.3.1C3.7 14.5 1 16 1 18v2h5v-2.5c0-1.4.6-2.6 2-3.5z"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5zm-8 8.5V17l8 5 8-5v-6.5l-8 4z"/></symbol>
  <symbol id="i-qc" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5.5 3.4 10.7 8 12 4.6-1.3 8-6.5 8-12V5zm-1.5 14L7 12.5l1.4-1.4 2.1 2.1 5.1-5.1 1.4 1.4z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v9l9 5 9-5zm-9-2.7L17.6 8 12 11.1 6.4 8zM5 9.7l6 3.3v6.3l-6-3.3z"/></symbol>
  <symbol id="i-mp" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 8c0-3 3.5-5 7-5s7 2 7 5v1H5zm14-9v-2h-2V7h2V5h2v2h2v2h-2v2z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.4A6.5 6.5 0 0 1 13.4 3.1C12.9 3 12.5 3 12 3z"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><path d="M3 4h18v16H3zm2 2v3h14V6zm0 5v3h6v-3zm8 0v3h6v-3zm-8 5v2h6v-2zm8 0v2h6v-2z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M17.6 6.4A8 8 0 0 0 4.3 10H2.2A10 10 0 0 1 19 5l2-2v6h-6zM6.4 17.6A8 8 0 0 0 19.7 14h2.1A10 10 0 0 1 5 19l-2 2v-6h6z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 17l1.4-1.4L8.8 13H20v-2H8.8l2.6-2.6L10 7l-5 5zM4 3h8v2H5v14h7v2H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/></symbol>
</svg>

<header class="hdr" id="hdr">
  <button id="hdr-back" class="hdr-btn" hidden aria-label="Back"><svg><use href="#i-back"/></svg></button>
  <button id="hdr-ctx" class="hdr-ctx">
    <span class="hdr-title" id="hdr-title">SG Data</span>
    <span class="hdr-sub" id="hdr-sub"></span>
  </button>
  <span id="queue-badge" class="badge" hidden></span>
</header>

<main id="main">

  <!-- LOGIN -->
  <section id="scr-login" class="screen" hidden>
    <div class="login">
      <div class="logo">SG</div>
      <h1>SG Data</h1>
      <p class="muted">Production data entry</p>
      <input id="in-pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="PIN">
      <button id="btn-login" class="btn primary big">Login</button>
      <p id="login-msg" class="msg"></p>
    </div>
  </section>

  <!-- TABS -->
  <section id="tab-home" class="screen tab" hidden>
    <div id="home-now"></div>
    <div id="home-timeline"></div>
  </section>

  <section id="tab-entry" class="screen tab" hidden>
    <div id="entry-grid"></div>
  </section>

  <section id="tab-data" class="screen tab" hidden>
    <div id="data-summary"></div>
    <div id="data-seg" class="seg"></div>
    <div id="data-body"></div>
  </section>

  <section id="tab-review" class="screen tab" hidden>
    <div class="card">
      <div class="row">
        <div class="field"><label>Status</label><select id="rv-status"><option value="Submitted">Submitted</option><option value="Approved">Approved</option><option value="Rejected">Rejected</option><option value="Sent">Sent</option><option value="">Sab (14 din)</option></select></div>
        <div class="field small"><label>Date</label><input id="rv-date" type="date"></div>
        <label class="chk"><input id="rv-all" type="checkbox"> All</label>
      </div>
    </div>
    <div id="rv-list" class="list"></div>
    <div class="sticky-bottom actions">
      <button id="btn-rv-reject" class="btn danger">Reject</button>
      <button id="btn-rv-approve" class="btn primary">Approve</button>
      <button id="btn-rv-send" class="btn ok">Send to Final</button>
    </div>
  </section>

  <section id="tab-main" class="screen tab" hidden>
    <div id="main-body"></div>
  </section>

  <!-- SUB SCREENS -->
  <section id="scr-att" class="screen" hidden>
    <div class="card">
      <div class="row">
        <div class="field"><label>Dept / Line</label><select id="att-dept"></select></div>
        <div class="field small"><label>Shift</label><select id="att-shift"></select></div>
      </div>
      <div id="att-banner" class="banner" hidden></div>
    </div>
    <table class="tbl">
      <thead><tr><th>Role</th><th>Hrs</th><th>Count</th></tr></thead>
      <tbody id="att-rows"></tbody>
      <tfoot><tr><td>Total</td><td id="att-total-hrs">0</td><td id="att-total-count">0</td></tr></tfoot>
    </table>
    <div class="sticky-bottom"><button id="btn-att-save" class="btn primary big">Save</button></div>
  </section>

  <section id="scr-hourly" class="screen" hidden>
    <div id="hr-types" class="toggle wide"></div>
    <div class="card">
      <div class="row"><div class="field"><label id="hr-dept-label">Line</label><select id="hr-dept"></select></div></div>
      <div class="row">
        <div class="field"><label>SRN</label><select id="hr-srn"></select></div>
        <button id="hr-refresh" class="hdr-btn dark" title="Loading refresh"><svg><use href="#i-refresh"/></svg></button>
      </div>
      <div class="row" id="hr-extra-row">
        <div class="field" id="hr-floor-wrap"><label>Floor</label><select id="hr-floor"></select></div>
        <div class="field" id="hr-checker-wrap" hidden><label>Checker</label><input id="hr-checker" type="text" placeholder="Checker ka naam"></div>
      </div>
      <div id="hr-balance" class="balance"></div>
      <div id="hr-banner" class="banner" hidden></div>
    </div>
    <table class="tbl slot-table">
      <thead id="hr-head"></thead>
      <tbody id="hr-rows"></tbody>
      <tfoot id="hr-foot"></tfoot>
    </table>
    <div class="sticky-bottom"><button id="btn-hr-save" class="btn primary big">Save</button></div>
  </section>

  <section id="scr-manpower" class="screen" hidden>
    <div class="card">
      <div class="row">
        <div class="field"><label>Dept / Line</label><select id="mp-dept"></select></div>
        <div class="field"><label>Role</label><select id="mp-role"></select></div>
      </div>
      <div class="row">
        <div class="field"><label>Kya hua</label><select id="mp-event"></select></div>
        <div class="field small"><label>Kitne log</label><input id="mp-count" type="number" inputmode="numeric" min="1" value="1"></div>
      </div>
      <div class="row">
        <div class="field small" id="mp-time-wrap"><label>Time</label><input id="mp-time" type="time"></div>
        <div class="field"><label>Note</label><input id="mp-note" type="text" placeholder="optional"></div>
      </div>
      <button id="btn-mp-save" class="btn primary big">Add</button>
    </div>
    <h2>Aaj ke events</h2>
    <div id="mp-list" class="list"></div>
  </section>

  <section id="scr-hour" class="screen" hidden>
    <div id="hour-head" class="hour-head"></div>
    <div id="hour-list"></div>
    <div class="sticky-bottom"><button id="btn-hour-save" class="btn primary big">Save all lines</button></div>
  </section>

  <section id="scr-dayclose" class="screen" hidden>
    <div class="card">
      <div class="row">
        <div class="field"><label>Dept (blank = sab)</label><select id="dc-dept"></select></div>
        <button id="btn-dc-preview" class="btn primary">Preview</button>
      </div>
      <p class="muted small-text">Hourly entries → final rows. Preview dekho, phir Submit. Submit ke baad us din ki entry lock ho jaati hai (manager reject kare to khulti hai).</p>
    </div>
    <div id="dc-out"></div>
    <div class="sticky-bottom"><button id="btn-dc-submit" class="btn primary big" disabled>Submit for review</button></div>
  </section>

</main>

<nav id="nav" class="nav" hidden>
  <button data-tab="home"><svg><use href="#i-home"/></svg><span>Home</span></button>
  <button data-tab="entry"><svg><use href="#i-entry"/></svg><span>Entry</span></button>
  <button data-tab="data"><svg><use href="#i-data"/></svg><span>Data</span></button>
  <button data-tab="review" class="manager-only"><svg><use href="#i-review"/></svg><span>Review</span><i id="nav-rv-count" class="dot" hidden></i></button>
  <button data-tab="main"><svg><use href="#i-user"/></svg><span>Main</span></button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet-body">
    <div class="sheet-head"><b id="sheet-title"></b><button id="sheet-close" class="hdr-btn dark" aria-label="Close">&#10005;</button></div>
    <div id="sheet-content"></div>
  </div>
</div>

<div id="busy" class="busy" hidden><div class="spinner"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="sheet.js"></script>
<script src="home.js"></script>
<script src="entry.js"></script>
<script src="data.js"></script>
<script src="hour.js"></script>
<script src="modules.js"></script>
</body>
</html>
